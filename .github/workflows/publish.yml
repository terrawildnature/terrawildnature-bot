name: Instagram'a paylaş

on:
  schedule:
    # 09:00, 13:00, 21:00 Türkiye saati (UTC+3)
    - cron: "0 6 * * *"
    - cron: "0 10 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch: {}

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish next post
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: python tools/publish.py
      - name: Move post to posted/
        run: |
          git config user.name "terrawildnature-bot"
          git config user.email "terrawildnature-bot@users.noreply.github.com"
          git add -A queue posted
          git commit -m "Paylaşıldı: $(ls -t posted | head -1)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
