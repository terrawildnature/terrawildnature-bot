name: Instagram'a paylaş

on:
  schedule:
    # 09:00, 12:00, 15:30, 18:00, 22:00 Türkiye saati (UTC+3); Reels 10:30, 13:30, 20:00 arada
    - cron: "0 6 * * *"
    - cron: "0 9 * * *"
    - cron: "30 12 * * *"
    - cron: "0 15 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch: {}

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish next post
        id: pub
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: |
          source tools/token.sh load
          source tools/token.sh load threads || echo "Threads anahtarı yok, Threads atlanacak"
          python tools/publish.py
      - name: Requeue on failure (retry later, after the others; a second failure parks it in queue_failed/)
        if: ${{ failure() && steps.pub.outcome == 'failure' }}
        run: |
          D="$(ls -d queue/*/ 2>/dev/null | sort | while read d; do [ -f "$d/post.json" ] && [ -f "$d/a.jpg" ] && [ -f "$d/b.jpg" ] && echo "${d%/}"; done | head -1)"
          [ -z "$D" ] && exit 0
          N=$(basename "$D")
          git config user.name "terrawildnature-bot"
          git config user.email "terrawildnature-bot@users.noreply.github.com"
          case "$N" in
            zz_*) mkdir -p queue_failed && git mv "$D" "queue_failed/$N" ;;
            *) git mv "$D" "queue/zz_$N" ;;
          esac
          git commit -m "Paylaşılamadı, sıranın sonuna alındı: $N"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
      - name: Move post to posted/
        run: |
          git config user.name "terrawildnature-bot"
          git config user.email "terrawildnature-bot@users.noreply.github.com"
          git add -A queue posted
          git commit -m "Paylaşıldı: $(ls -t posted | head -1)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
