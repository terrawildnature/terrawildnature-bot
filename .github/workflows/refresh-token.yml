name: Instagram anahtarını yenile

on:
  schedule:
    - cron: "0 3 * * 1"   # her pazartesi
  workflow_dispatch: {}

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh and store encrypted token
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
        run: |
          source tools/token.sh load
          NEW=$(python tools/publish.py --refresh)
          echo "::add-mask::$NEW"
          IG_TOKEN="$NEW" python tools/publish.py --check
          bash tools/token.sh save "$NEW"
      - name: Refresh Threads token (never blocks Instagram)
        continue-on-error: true
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
        run: |
          source tools/token.sh load threads
          NEW=$(python tools/threads.py --refresh)
          echo "::add-mask::$NEW"
          THREADS_TOKEN="$NEW" python tools/threads.py --check
          bash tools/token.sh save "$NEW" threads
      - name: Commit
        run: |
          git config user.name "terrawildnature-bot"
          git config user.email "terrawildnature-bot@users.noreply.github.com"
          git add data/*_token.enc
          git commit -m "Instagram ve Threads anahtarları yenilendi" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
