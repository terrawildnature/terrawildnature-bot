name: Reels seslendirmesini hazırla

on:
  schedule:
    # Her gün 09:00-18:00 (Türkiye) arası her saat; ses hazırsa hiçbir şey yapmaz
    - cron: "0 6-15 * * *"
  workflow_dispatch: {}

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-24.04   # ffmpeg is preinstalled here; the newer image lacks it
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record narration for the next reel
        run: |
          DIR=$(ls -d queue_reels/*/ 2>/dev/null | sort | head -1)
          if [ -z "$DIR" ]; then echo "Reels kuyruğu boş"; exit 0; fi
          pip install -q pillow numpy edge-tts
          python tools/reel.py --voice "${DIR%/}"
      - name: Commit
        run: |
          git config user.name "terrawildnature-bot"
          git config user.email "terrawildnature-bot@users.noreply.github.com"
          git add queue_reels
          git commit -m "Reels seslendirmesi hazırlandı" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
