name: Reels seslendirmesini hazırla

on:
  schedule:
    # Her gün 06:35-19:35 (Türkiye) arası her saat; ses hazırsa hiçbir şey yapmaz
    - cron: "35 3-16 * * *"
  workflow_dispatch: {}

# Own group: three runs in one concurrency group cancel the pending one, which could be a post. Reel dirs are
# picked only when they hold reel.json, so cache files pushed into a just-published dir are harmless.
concurrency:
  group: voice
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-24.04   # ffmpeg is preinstalled here; the newer image lacks it
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record narration for the queued reels
        run: |
          DIRS=$(ls -d queue_reels/*/ 2>/dev/null | sort | while read d; do [ -f "$d/reel.json" ] && echo "${d%/}"; done)
          if [ -z "$DIRS" ]; then echo "Reels kuyruğu boş"; exit 0; fi
          pip install -q pillow numpy edge-tts
          for d in $DIRS; do python tools/reel.py --voice "$d" || true; done
      - name: Commit
        run: |
          git config user.name "terrawildnature-bot"
          git config user.email "terrawildnature-bot@users.noreply.github.com"
          git add queue_reels
          git commit -m "Reels seslendirmesi hazırlandı" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
