name: Reels paylaş

on:
  schedule:
    # Pazartesi, Çarşamba, Cuma, Pazar — video ~19:45'te üretilir, 20:00 civarı yayında (Türkiye, UTC+3)
    - cron: "45 16 * * 0,1,3,5"
  workflow_dispatch:
    inputs:
      test:
        description: "Sadece videoyu üret, paylaşma"
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          pip install -q pillow numpy edge-tts
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Pick next reel
        id: pick
        run: |
          DIR=$(ls -d queue_reels/*/ 2>/dev/null | sort | head -1)
          if [ -z "$DIR" ]; then echo "Reels kuyruğu boş"; exit 2; fi
          echo "dir=${DIR%/}" >> "$GITHUB_OUTPUT"
      - name: Render video
        run: python tools/reel.py "${{ steps.pick.outputs.dir }}"
      - name: Upload test video
        if: ${{ inputs.test }}
        uses: actions/upload-artifact@v4
        with:
          name: reel-test
          path: ${{ steps.pick.outputs.dir }}/reel.mp4
      - name: Publish to Instagram
        if: ${{ !inputs.test }}
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: |
          source tools/token.sh load
          python tools/publish.py --reel "${{ steps.pick.outputs.dir }}"
      - name: Commit
        if: ${{ !inputs.test }}
        run: |
          git config user.name "terrawildnature-bot"
          git config user.email "terrawildnature-bot@users.noreply.github.com"
          git add -A queue_reels posted_reels
          git commit -m "Reels paylaşıldı: $(basename ${{ steps.pick.outputs.dir }})"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
