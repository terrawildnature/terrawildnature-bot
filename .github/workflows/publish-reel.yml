name: Reels paylaş

on:
  schedule:
    # Her gün 19:20 (Türkiye). GitHub zamanlayıcısı 20-30 dk gecikebildiği için erken; yayın ~20:00
    - cron: "20 16 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Sadece videoyu üret, paylaşma"
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-24.04   # ffmpeg is preinstalled here; the newer image lacks it
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          pip install -q pillow numpy edge-tts
          command -v ffmpeg || (timeout 600 sudo apt-get update -qq && timeout 900 sudo apt-get install -y -qq ffmpeg)
          ffmpeg -version | head -1
      - name: Pick next reel
        id: pick
        run: |
          DIR=$(ls -d queue_reels/*/ 2>/dev/null | sort | head -1)
          if [ -z "$DIR" ]; then echo "Reels kuyruğu boş"; exit 2; fi
          echo "dir=${DIR%/}" >> "$GITHUB_OUTPUT"
      - name: Render video
        run: python tools/reel.py "${{ steps.pick.outputs.dir }}"
      - name: Upload test video
        if: ${{ inputs.test }}
        uses: actions/upload-artifact@v4
        with:
          name: reel-test
          path: ${{ steps.pick.outputs.dir }}/reel.mp4
      - name: Publish to Instagram
        if: ${{ !inputs.test }}
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          GH_TOKEN: ${{ github.token }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: |
          # Instagram downloads the video from a public URL: park it as a temporary release asset
          NAME="$(basename "${{ steps.pick.outputs.dir }}").mp4"
          cp "${{ steps.pick.outputs.dir }}/reel.mp4" "$NAME"
          gh release view reel-media >/dev/null 2>&1 || gh release create reel-media --title "Reels (geçici video dosyaları)" --notes "Paylaşım sırasında geçici olarak tutulur, sonra silinir."
          gh release upload reel-media "$NAME" --clobber
          export VIDEO_URL="https://github.com/${{ github.repository }}/releases/download/reel-media/$NAME"
          source tools/token.sh load
          source tools/token.sh load threads || echo "Threads anahtarı yok, Threads atlanacak"
          python tools/publish.py --reel "${{ steps.pick.outputs.dir }}"
          gh release delete-asset reel-media "$NAME" -y || true
      - name: Commit
        if: ${{ !inputs.test }}
        run: |
          git config user.name "terrawildnature-bot"
          git config user.email "terrawildnature-bot@users.noreply.github.com"
          git add -A queue_reels posted_reels
          git commit -m "Reels paylaşıldı: $(basename ${{ steps.pick.outputs.dir }})"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
