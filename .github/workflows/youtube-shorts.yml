name: YouTube Shorts paylaş

# Five times a day, about an hour after each Instagram post (09:00, 12:00, 15:30, 18:00, 22:00), turn the newest
# published post into a YouTube-only "Tahmin Et" quiz Short (youtube/tools/quiz_short.py) and upload it; the last run
# also uploads one left over (a skipped run or a quota-short documentary day). Runs only while YT_AUTO_UPLOAD=true.
on:
  schedule:
    - cron: "5 7 * * *"     # 10:05 Turkey
    - cron: "5 10 * * *"    # 13:05 Turkey
    - cron: "35 13 * * *"   # 16:35 Turkey
    - cron: "5 16 * * *"    # 19:05 Turkey
    - cron: "5 20 * * *"    # 23:05 Turkey (+ backfill)
  workflow_dispatch: {}

concurrency:
  group: youtube-shorts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  shorts:
    if: ${{ vars.YT_AUTO_UPLOAD == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          pip install -q pillow numpy edge-tts
          if ! command -v ffmpeg >/dev/null; then
            for i in 1 2 3; do
              curl -fsSL --retry 3 --max-time 300 -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz && break
              sleep 10
            done
            mkdir -p /tmp/ffmpeg && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
            echo "/tmp/ffmpeg/bin" >> "$GITHUB_PATH"
          fi
      - name: Render and upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          FAIL=0
          BACKFILL=""
          case "${{ github.event.schedule }}" in "5 20 * * *"|"") BACKFILL="--backfill" ;; esac
          for d in $(python youtube/tools/shorts.py --pick $BACKFILL); do
            echo "== $d"
            python youtube/tools/shorts.py "$d" || FAIL=1
          done
          exit $FAIL
      - name: Commit
        if: ${{ always() }}
        run: |
          git config user.name "terrawildnature-bot"
          git config user.email "terrawildnature-bot@users.noreply.github.com"
          git add posted/*/youtube.json posted_reels/*/youtube.json 2>/dev/null || true
          git commit -m "YouTube Shorts yüklendi" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
