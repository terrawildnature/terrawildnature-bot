name: Reklam bekçisi

# Daily check of the paid follower campaign (tools/ad_guard.py): records spend and followers in data/ad_stats.json,
# pauses the ad set when a follower costs more than the owner's limit, opens an issue (e-mail) for anything to act on.
# Runs after stats.yml has refreshed data/followers.csv.
on:
  schedule:
    - cron: "40 2 * * *"    # 05:40 Turkey
    - cron: "40 14 * * *"   # 17:40 Turkey (spend check; followers.csv is from the morning)
  workflow_dispatch: {}

concurrency:
  group: ad-guard
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  guard:
    if: ${{ vars.AD_GUARD != 'off' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check campaign
        env:
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
        run: python tools/ad_guard.py
      - name: Commit
        if: ${{ always() }}
        run: |
          git config user.name "terrawildnature-bot"
          git config user.email "terrawildnature-bot@users.noreply.github.com"
          git add data/ad_stats.json 2>/dev/null || true
          git commit -m "Reklam durumu" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
